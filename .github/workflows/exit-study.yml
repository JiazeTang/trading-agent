# 下载 半导体、REGN/VRTX、SMH 和 S&P 500 的日线，跑止损止盈与震荡市模拟，只提交汇总结果（原始价格不提交）。
name: exit-study

on:
  workflow_dispatch:
  push:
    branches: [claude/vigilant-ride-f8334c]
    paths:
      - "src/riskeval/exit_study.py"
      - ".github/workflows/exit-study.yml"

permissions:
  contents: write

concurrency:
  group: exit-study
  cancel-in-progress: true

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,study]"
      - run: pytest -q
      - run: python -m riskeval.exit_study --out reports/exit_study
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/exit_study
          git diff --cached --quiet && exit 0
          git commit -m "Update exit_study results"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
