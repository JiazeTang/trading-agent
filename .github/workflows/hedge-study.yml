# 下载 半导体、生物科技、消费电子的日线，跑对冲测试，只提交汇总结果（原始价格不提交）。
name: hedge-study

on:
  workflow_dispatch:
  push:
    branches: [claude/vigilant-ride-f8334c]
    paths:
      - "src/riskeval/hedge_study.py"
      - ".github/workflows/hedge-study.yml"

permissions:
  contents: write

concurrency:
  group: hedge-study
  cancel-in-progress: true

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,study]"
      - run: pytest -q
      - run: python -m riskeval.hedge_study --out reports/hedge_study
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/hedge_study
          git diff --cached --quiet && exit 0
          git commit -m "Update hedge_study results"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
