# 下载 S&P 500 的日线，跑 S&P 500 均值回归扩展测试，只提交汇总结果（原始价格不提交）。
name: mr-universe

on:
  workflow_dispatch:
  push:
    branches: [claude/vigilant-ride-f8334c]
    paths:
      - "src/riskeval/mr_universe.py"
      - ".github/workflows/mr-universe.yml"

permissions:
  contents: write

concurrency:
  group: mr-universe
  cancel-in-progress: true

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,study]"
      - run: pytest -q
      - run: python -m riskeval.mr_universe --out reports/mr_universe
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/mr_universe
          git diff --cached --quiet && exit 0
          git commit -m "Update mr_universe results"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
