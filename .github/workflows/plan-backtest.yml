# 下载 16 只半导体、SMH、QQQ、REGN、VRTX 的日线，把整个账户 8000 按现行方案从 2016 年起回测，只提交汇总结果（原始价格不提交）。
name: plan-backtest

on:
  workflow_dispatch:
  push:
    branches: [claude/vigilant-ride-f8334c]
    paths:
      - "src/riskeval/plan_backtest.py"
      - ".github/workflows/plan-backtest.yml"

permissions:
  contents: write

concurrency:
  group: plan-backtest
  cancel-in-progress: true

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,study]"
      - run: pytest -q
      - run: python -m riskeval.plan_backtest --out reports/plan_backtest
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/plan_backtest
          git diff --cached --quiet && exit 0
          git commit -m "Update plan_backtest results"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
