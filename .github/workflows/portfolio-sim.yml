# 下载 半导体、REGN/VRTX 和 SMH 的日线，跑组合模拟，只提交汇总结果（原始价格不提交）。
name: portfolio-sim

on:
  workflow_dispatch:
  push:
    branches: [claude/vigilant-ride-f8334c]
    paths:
      - "src/riskeval/portfolio_sim.py"
      - ".github/workflows/portfolio-sim.yml"

permissions:
  contents: write

concurrency:
  group: portfolio-sim
  cancel-in-progress: true

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,study]"
      - run: pytest -q
      - run: python -m riskeval.portfolio_sim --out reports/portfolio_sim
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/portfolio_sim
          git diff --cached --quiet && exit 0
          git commit -m "Update portfolio_sim results"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
