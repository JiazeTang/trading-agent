# 下载 16 只半导体股和 SMH 的日线，跑结构改进回测，只提交汇总结果（原始价格不提交）。
name: structure-study

on:
  workflow_dispatch:
  push:
    branches: [claude/vigilant-ride-f8334c]
    paths:
      - "src/riskeval/structure_study.py"
      - ".github/workflows/structure-study.yml"

permissions:
  contents: write

concurrency:
  group: structure-study
  cancel-in-progress: true

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,study]"
      - run: pytest -q
      - run: python -m riskeval.structure_study --out reports/structure_study
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/structure_study
          git diff --cached --quiet && exit 0
          git commit -m "Update structure_study results"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
