# 下载 半导体、QQQ、SMH 的日线和小时线，跑交易风格对比，只提交汇总结果（原始价格不提交）。
name: style-compare

on:
  workflow_dispatch:
  push:
    branches: [claude/vigilant-ride-f8334c]
    paths:
      - "src/riskeval/style_compare.py"
      - ".github/workflows/style-compare.yml"

permissions:
  contents: write

concurrency:
  group: style-compare
  cancel-in-progress: true

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,study]"
      - run: pytest -q
      - run: python -m riskeval.style_compare --out reports/style_compare
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/style_compare
          git diff --cached --quiet && exit 0
          git commit -m "Update style_compare results"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
